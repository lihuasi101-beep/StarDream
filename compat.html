<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STAR DREAM / Original Compatibility</title>
  <link rel="stylesheet" href="compat/runtime/js-dos.css">
  <style>
    :root { --ink:#172237; --ink-soft:#27344c; --paper:#f7efd9; --teal:#5cd6c0; --coral:#ed675c; --yellow:#f4c858; --line:rgba(247,239,217,.2); }
    * { box-sizing:border-box; }
    html, body { min-height:100%; margin:0; background:var(--ink); color:var(--paper); font-family:"Trebuchet MS","Microsoft YaHei",sans-serif; letter-spacing:0; }
    body { background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px); background-size:22px 22px; }
    button, select { font:inherit; letter-spacing:0; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
    button { border:0; cursor:pointer; }
    button:disabled { cursor:not-allowed; opacity:.45; }
    .compat-shell { width:min(1180px,100%); margin:0 auto; padding:22px clamp(16px,4vw,54px) 44px; }
    .compat-header { display:flex; justify-content:space-between; align-items:flex-start; gap:18px; padding-bottom:18px; border-bottom:1px solid var(--line); }
    .compat-title { display:flex; align-items:center; gap:12px; }
    .mark { width:42px; height:42px; display:grid; place-items:center; color:var(--ink); background:var(--yellow); border:3px solid var(--paper); box-shadow:4px 4px 0 var(--coral); font-size:22px; font-weight:900; transform:rotate(-4deg); }
    h1 { margin:0; font-family:Georgia,serif; font-size:clamp(22px,3vw,35px); line-height:1; }
    .eyebrow { margin:7px 0 0; color:var(--teal); font-size:10px; letter-spacing:1.5px; text-transform:uppercase; }
    .back-link { padding:9px 11px; color:var(--paper); border:1px solid var(--line); background:var(--ink-soft); font-size:11px; text-decoration:none; }
    .back-link:hover { border-color:var(--teal); }
    .control-bar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:18px 0 12px; }
    .control-bar label { color:var(--paper-dim,#ded5bf); font-size:11px; }
    select { min-height:44px; padding:0 28px 0 10px; border:1px solid var(--line); background:var(--ink-soft); color:var(--paper); }
    .control-button { min-height:44px; padding:0 13px; color:var(--ink); background:var(--teal); font-size:11px; font-weight:900; }
    .control-button.stop { color:var(--paper); background:var(--coral); }
    .control-button.save { color:var(--ink); background:var(--yellow); }
    .status { min-height:37px; display:flex; align-items:center; flex:1 1 230px; padding:0 11px; border-left:3px solid var(--yellow); background:rgba(39,52,76,.8); color:var(--paper); font-size:11px; }
    .emulator-frame { padding:15px; border:1px solid var(--line); background:#0b101b; box-shadow:0 18px 34px rgba(6,12,25,.24); overflow:hidden; }
    #dosbox { width:100%; aspect-ratio:4 / 3; height:auto; min-height:0; background:#000; touch-action:none; overscroll-behavior:contain; }
    #dosbox > .jsdos-rso, #dosbox canvas { width:100%; height:100%; }
    #dosbox canvas { display:block; image-rendering:pixelated; }
    #dosbox .stardream-input-layer { position:absolute; z-index:4; touch-action:none; user-select:none; -webkit-user-select:none; cursor:default; }
    .compat-note { display:grid; grid-template-columns:1.2fr 1fr; gap:12px; margin-top:12px; }
    .note { padding:12px; border-top:3px solid var(--teal); background:var(--ink-soft); color:#ded5bf; font-size:11px; line-height:1.55; }
    .note strong { color:var(--paper); }
    code { color:var(--yellow); font-family:Consolas,monospace; }
    @media (max-width:700px) { .compat-header { flex-direction:column; } .back-link { align-self:stretch; text-align:center; } .compat-note { grid-template-columns:1fr; } .emulator-frame { padding:8px; } }
  </style>
</head>
<body>
  <main class="compat-shell">
    <header class="compat-header">
      <div class="compat-title"><div class="mark" aria-hidden="true">★</div><div><h1>STAR DREAM</h1><p class="eyebrow">Original binary / WebAssembly compatibility</p></div></div>
      <a class="back-link" href="index.html">← 返回 Web Edition</a>
    </header>
    <section class="control-bar" aria-label="兼容模式控制">
      <label for="language">语言包</label>
      <select id="language"><option value="chs">简体中文 / STAR_CHS</option><option value="cht">繁體中文 / STAR_CHT</option></select>
      <button class="control-button" id="launch" type="button">▶ 启动原版</button>
      <button class="control-button save" id="save-original" type="button" disabled>◆ 保存存档</button>
      <button class="control-button stop" id="stop" type="button" disabled>■ 停止</button>
      <div class="status" id="status" role="status" aria-live="polite">兼容层待启动 · DOSBox-X WebAssembly 8.4.1</div>
    </section>
    <section class="emulator-frame"><div id="dosbox"></div></section>
    <section class="compat-note">
      <div class="note"><strong>运行链路</strong><br>浏览器 → js-dos → DOSBox-X WASM → 虚拟文件系统 → <code>STAROPEN.EXE</code> → <code>STARDOM.EXE</code></div>
      <div class="note"><strong>存档边界</strong><br><code>STARSAVE.SSS</code> 会按语言包保存到浏览器 IndexedDB；启动原版时自动恢复，点击“保存存档”或停止兼容层时写回。</div>
    </section>
  </main>
  <script src="compat/runtime/js-dos.js"></script>
  <script>
    (() => {
      const status = document.getElementById("status");
      const launch = document.getElementById("launch");
      const saveOriginalButton = document.getElementById("save-original");
      const stop = document.getElementById("stop");
      const language = document.getElementById("language");
      const host = document.getElementById("dosbox");
      let player = null;
      let commandInterface = null;
      let currentFolder = "";
      let launchInProgress = false;
      let viewportObserver = null;
      let viewportMutationObserver = null;
      let canvasStyleObserver = null;
      let viewportFrame = 0;
      const viewportTimers = [];
      const EMULATOR_SIDEBAR_WIDTH = 48;
      const EMULATOR_NATIVE_WIDTH = 640;
      const EMULATOR_NATIVE_HEIGHT = 480;
      const EMULATOR_ACTIVE_HEIGHT = 420;
      let inputLayer = null;
      let inputLayerCleanup = null;
      const activePointerButtons = new Map();
      const SAVE_DB_NAME = "stardream-original-save-v1";
      const SAVE_STORE_NAME = "saves";
      const ASSET_CACHE_NAME = "stardream-original-assets-v1";
      const assetMemoryCache = new Map();
      let assetCachePromise = null;
      if (new URLSearchParams(window.location.search).get("lang") === "cht") language.value = "cht";
      const ORIGINAL_FILES = [
        "BOWLING.ARB", "CDROM01.DAT", "INST.CFG", "INSTW.DAT", "MODELALL.ARB", "OPDANCE.ARB",
        "PLAY.BAT", "STARARJ.ARB", "STARDOM.EXE", "STARDOM.MKB", "STARFON.MKB", "STARFONA.MKB",
        "STARMAP.ARB", "STARMUSA.MKB", "STAROPEN.ARB", "STAROPEN.EXE", "STARSA00.SSS", "STARSAVE.SSS"
      ];
      const DOSBOX_CONFIG = `[sdl]
fullscreen=false
fulldouble=false
fullresolution=original
windowresolution=original
output=surface
autolock=false
usescancodes=true
[dosbox]
machine=svga_s3
memsize=2
[render]
frameskip=0
aspect=true
scaler=none
[cpu]
core=auto
cycles=auto 20000 50% limit 50000
[mixer]
nosound=false
rate=44100
[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
[speaker]
pcspeaker=true
[dos]
xms=true
ems=false
umb=true
keyboardlayout=none
[autoexec]
mount c . -freesize 1024
c:
cd STAR_CHS
STAROPEN.EXE
exit`;

      function saveKey(folder) { return `STARSAVE.SSS:${folder}`; }

      function openSaveDb() {
        return new Promise((resolve, reject) => {
          if (!window.indexedDB) { reject(new Error("当前浏览器不支持 IndexedDB")); return; }
          const request = indexedDB.open(SAVE_DB_NAME, 1);
          request.onupgradeneeded = () => request.result.createObjectStore(SAVE_STORE_NAME);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error || new Error("IndexedDB 打开失败"));
        });
      }

      async function readStoredSave(folder) {
        const db = await openSaveDb();
        return new Promise((resolve, reject) => {
          const request = db.transaction(SAVE_STORE_NAME, "readonly").objectStore(SAVE_STORE_NAME).get(saveKey(folder));
          request.onsuccess = () => resolve(request.result ? new Uint8Array(request.result) : null);
          request.onerror = () => reject(request.error || new Error("IndexedDB 读取失败"));
        }).finally(() => db.close());
      }

      async function writeStoredSave(folder, bytes) {
        const db = await openSaveDb();
        return new Promise((resolve, reject) => {
          const request = db.transaction(SAVE_STORE_NAME, "readwrite").objectStore(SAVE_STORE_NAME).put(bytes.buffer, saveKey(folder));
          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error || new Error("IndexedDB 写入失败"));
        }).finally(() => db.close());
      }

      async function saveOriginalSave(showStatus = true) {
        if (!commandInterface || !currentFolder) {
          if (showStatus) setStatus("原版存档尚未就绪 · 请先启动兼容层");
          return false;
        }
        try {
          if (showStatus) setStatus(`正在读取原版存档 · ${currentFolder}`);
          const readPromise = commandInterface.fsReadFile(`${currentFolder}/STARSAVE.SSS`);
          const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error("虚拟文件读取超时")), 8000));
          const bytes = new Uint8Array(await Promise.race([readPromise, timeoutPromise]));
          await writeStoredSave(currentFolder, bytes);
          if (showStatus) setStatus(`原版存档已保存 · ${currentFolder} · ${bytes.byteLength} bytes`);
          return true;
        } catch (error) {
          if (showStatus) setStatus(`原版存档保存失败 · ${error.message || error}`);
          return false;
        }
      }

      function setStatus(text) { status.textContent = text; }

      function getEmulatorGeometry() {
        const canvas = host.querySelector("canvas");
        const stage = canvas && canvas.parentElement;
        const overlay = host.querySelector(".emulator-mouse-overlay");
        const input = host.querySelector(".stardream-input-layer");
        const rect = (element) => element ? element.getBoundingClientRect().toJSON() : null;
        return {
          viewport: { width: window.innerWidth, height: window.innerHeight, dpr: window.devicePixelRatio || 1 },
          host: rect(host),
          stage: rect(stage),
          canvas: rect(canvas),
          overlay: rect(overlay),
          inputLayer: rect(input),
          canvasPixels: canvas ? { width: canvas.width, height: canvas.height } : null,
          inputViewport: canvas ? { width: EMULATOR_NATIVE_WIDTH, height: EMULATOR_ACTIVE_HEIGHT } : null
        };
      }

      function isEmulatorFullscreen() {
        return document.fullscreenElement === host || host.classList.contains("jsdos-fullscreen-workaround");
      }

      function clampUnit(value) {
        return Math.max(0, Math.min(1, value));
      }

      function sendInputMotion(event) {
        if (!inputLayer || !commandInterface || typeof commandInterface.sendMouseMotion !== "function") return;
        const rect = inputLayer.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        commandInterface.sendMouseMotion(
          clampUnit((event.clientX - rect.left) / rect.width),
          clampUnit((event.clientY - rect.top) / rect.height)
        );
      }

      function inputButton(event) {
        return event.button === 0 ? 0 : 1;
      }

      function releaseInputButtons(pointerId) {
        if (!commandInterface || typeof commandInterface.sendMouseButton !== "function") return;
        const buttons = activePointerButtons.get(pointerId);
        if (!buttons) return;
        buttons.forEach((button) => commandInterface.sendMouseButton(button, false));
        activePointerButtons.delete(pointerId);
      }

      function installInputLayer() {
        if (inputLayer || !commandInterface || typeof commandInterface.sendMouseMotion !== "function" || typeof commandInterface.sendMouseButton !== "function") return;
        const canvas = host.querySelector("canvas");
        const stage = canvas && canvas.parentElement;
        if (!canvas || !stage) return;
        inputLayer = document.createElement("div");
        inputLayer.className = "stardream-input-layer";
        inputLayer.setAttribute("aria-hidden", "true");
        stage.appendChild(inputLayer);

        const prevent = (event) => {
          event.preventDefault();
          event.stopPropagation();
        };
        const onPointerDown = (event) => {
          if (!event.isPrimary) return;
          prevent(event);
          sendInputMotion(event);
          const button = inputButton(event);
          let buttons = activePointerButtons.get(event.pointerId);
          if (!buttons) {
            buttons = new Set();
            activePointerButtons.set(event.pointerId, buttons);
          }
          if (!buttons.has(button)) {
            buttons.add(button);
            commandInterface.sendMouseButton(button, true);
          }
          try { inputLayer.setPointerCapture(event.pointerId); } catch (_) {}
        };
        const onPointerMove = (event) => {
          if (!event.isPrimary) return;
          prevent(event);
          sendInputMotion(event);
        };
        const onPointerUp = (event) => {
          if (!event.isPrimary) return;
          prevent(event);
          sendInputMotion(event);
          releaseInputButtons(event.pointerId);
          try { inputLayer.releasePointerCapture(event.pointerId); } catch (_) {}
        };
        const onPointerCancel = (event) => {
          if (!event.isPrimary) return;
          prevent(event);
          releaseInputButtons(event.pointerId);
        };
        const onLostPointerCapture = (event) => releaseInputButtons(event.pointerId);
        const onContextMenu = (event) => prevent(event);
        const onWindowBlur = () => {
          activePointerButtons.forEach((_, pointerId) => releaseInputButtons(pointerId));
        };
        inputLayer.addEventListener("pointerdown", onPointerDown, { passive: false });
        inputLayer.addEventListener("pointermove", onPointerMove, { passive: false });
        inputLayer.addEventListener("pointerup", onPointerUp, { passive: false });
        inputLayer.addEventListener("pointercancel", onPointerCancel, { passive: false });
        inputLayer.addEventListener("lostpointercapture", onLostPointerCapture);
        inputLayer.addEventListener("contextmenu", onContextMenu, { passive: false });
        window.addEventListener("blur", onWindowBlur);
        inputLayerCleanup = () => {
          activePointerButtons.forEach((_, pointerId) => releaseInputButtons(pointerId));
          inputLayer.removeEventListener("pointerdown", onPointerDown);
          inputLayer.removeEventListener("pointermove", onPointerMove);
          inputLayer.removeEventListener("pointerup", onPointerUp);
          inputLayer.removeEventListener("pointercancel", onPointerCancel);
          inputLayer.removeEventListener("lostpointercapture", onLostPointerCapture);
          inputLayer.removeEventListener("contextmenu", onContextMenu);
          window.removeEventListener("blur", onWindowBlur);
          inputLayer.remove();
          inputLayer = null;
          inputLayerCleanup = null;
        };
        syncEmulatorViewport();
      }

      function uninstallInputLayer() {
        if (inputLayerCleanup) inputLayerCleanup();
        else activePointerButtons.clear();
      }

      function syncCanvasInputViewport() {
        const canvas = host.querySelector("canvas");
        const stage = canvas && canvas.parentElement;
        if (!canvas || !stage) return;
        const stageRect = stage.getBoundingClientRect();
        const width = stageRect.width;
        if (!width) return;
        const fullHeight = width * EMULATOR_NATIVE_HEIGHT / EMULATOR_NATIVE_WIDTH;
        const activeHeight = width * EMULATOR_ACTIVE_HEIGHT / EMULATOR_NATIVE_WIDTH;
        const top = Math.max(0, (stageRect.height - fullHeight) / 2);
        canvas.style.setProperty("width", `${width}px`, "important");
        canvas.style.setProperty("height", `${activeHeight}px`, "important");
        canvas.style.setProperty("left", "0px", "important");
        canvas.style.setProperty("top", `${top}px`, "important");
        canvas.style.setProperty("object-fit", "cover", "important");
        canvas.style.setProperty("object-position", "top", "important");
        if (inputLayer && inputLayer.parentElement === stage) {
          inputLayer.style.setProperty("width", `${width}px`, "important");
          inputLayer.style.setProperty("height", `${activeHeight}px`, "important");
          inputLayer.style.setProperty("left", "0px", "important");
          inputLayer.style.setProperty("top", `${top}px`, "important");
        }
      }

      function syncEmulatorViewport() {
        const canvas = host.querySelector("canvas");
        const stage = canvas && canvas.parentElement;
        if (isEmulatorFullscreen()) {
          host.style.height = "";
          syncCanvasInputViewport();
          return;
        }
        const hostWidth = host.getBoundingClientRect().width;
        const stageWidth = stage ? stage.getBoundingClientRect().width : hostWidth - EMULATOR_SIDEBAR_WIDTH;
        if (!stageWidth) return;
        const targetHeight = stageWidth * 3 / 4;
        const currentHeight = host.getBoundingClientRect().height;
        if (Math.abs(currentHeight - targetHeight) > 0.5) {
          host.style.height = `${targetHeight}px`;
        }
        syncCanvasInputViewport();
      }

      function scheduleEmulatorViewportSync() {
        if (viewportFrame) return;
        viewportFrame = window.setTimeout(() => {
          viewportFrame = 0;
          syncEmulatorViewport();
          window.requestAnimationFrame(syncEmulatorViewport);
        }, 0);
      }

      function watchEmulatorViewport() {
        if (!viewportObserver) viewportObserver = new ResizeObserver(scheduleEmulatorViewportSync);
        if (!viewportMutationObserver) viewportMutationObserver = new MutationObserver(scheduleEmulatorViewportSync);
        if (!canvasStyleObserver) canvasStyleObserver = new MutationObserver(scheduleEmulatorViewportSync);
        viewportObserver.observe(host);
        viewportMutationObserver.observe(host, { childList: true, subtree: true, attributes: true, attributeFilter: ["class", "style"] });
        const canvas = host.querySelector("canvas");
        if (canvas) canvasStyleObserver.observe(canvas, { attributes: true, attributeFilter: ["style"] });
        window.addEventListener("resize", scheduleEmulatorViewportSync, { passive: true });
        window.addEventListener("orientationchange", scheduleEmulatorViewportSync, { passive: true });
        window.addEventListener("fullscreenchange", scheduleEmulatorViewportSync, { passive: true });
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", scheduleEmulatorViewportSync, { passive: true });
          window.visualViewport.addEventListener("scroll", scheduleEmulatorViewportSync, { passive: true });
        }
        scheduleEmulatorViewportSync();
        [0, 100, 500, 1500].forEach((delay) => viewportTimers.push(window.setTimeout(scheduleEmulatorViewportSync, delay)));
      }

      function unwatchEmulatorViewport() {
        if (viewportObserver) viewportObserver.disconnect();
        if (viewportMutationObserver) viewportMutationObserver.disconnect();
        if (canvasStyleObserver) canvasStyleObserver.disconnect();
        window.removeEventListener("resize", scheduleEmulatorViewportSync);
        window.removeEventListener("orientationchange", scheduleEmulatorViewportSync);
        window.removeEventListener("fullscreenchange", scheduleEmulatorViewportSync);
        if (window.visualViewport) {
          window.visualViewport.removeEventListener("resize", scheduleEmulatorViewportSync);
          window.visualViewport.removeEventListener("scroll", scheduleEmulatorViewportSync);
        }
        if (viewportFrame) {
          window.clearTimeout(viewportFrame);
          viewportFrame = 0;
        }
        while (viewportTimers.length) window.clearTimeout(viewportTimers.pop());
      }

      function openAssetCache() {
        if (!window.caches) return Promise.resolve(null);
        if (!assetCachePromise) assetCachePromise = window.caches.open(ASSET_CACHE_NAME).catch(() => null);
        return assetCachePromise;
      }

      async function readOriginalAsset(folder, file) {
        const key = `${folder}/${file}`;
        const cachedBytes = assetMemoryCache.get(key);
        if (cachedBytes) return cachedBytes.slice();
        const url = new URL(key, document.baseURI).toString();
        const cache = await openAssetCache();
        if (cache) {
          const cachedResponse = await cache.match(url).catch(() => null);
          if (cachedResponse) {
            const bytes = new Uint8Array(await cachedResponse.arrayBuffer());
            assetMemoryCache.set(key, bytes);
            return bytes.slice();
          }
        }
        const response = await fetch(url, { cache: "force-cache" });
        if (!response.ok) throw new Error(`原始资源加载失败 (${response.status}) · ${file}`);
        const responseForCache = cache ? response.clone() : null;
        const bytes = new Uint8Array(await response.arrayBuffer());
        assetMemoryCache.set(key, bytes);
        if (cache && responseForCache) await cache.put(url, responseForCache).catch(() => {});
        return bytes.slice();
      }

      async function launchOriginal() {
        if (player || launchInProgress) return;
        launchInProgress = true;
        launch.disabled = true;
        language.disabled = true;
        const folder = language.value === "cht" ? "STAR_CHT" : "STAR_CHS";
        currentFolder = folder;
        commandInterface = null;
        saveOriginalButton.disabled = true;
        host.innerHTML = "";
        syncEmulatorViewport();
        setStatus("正在加载原始资源和 DOSBox WebAssembly…");
        try {
          let storedSave = null;
          try { storedSave = await readStoredSave(folder); } catch (error) { setStatus(`本地存档不可用 · ${error.message || error}`); }
          let loadedCount = 0;
          const initFs = await Promise.all(ORIGINAL_FILES.map(async (file) => {
            const asset = await readOriginalAsset(folder, file);
            loadedCount += 1;
            setStatus(`正在加载原始资源 ${loadedCount}/${ORIGINAL_FILES.length} · ${file}`);
            const contents = file === "STARSAVE.SSS" && storedSave ? storedSave : asset;
            return { path: `${folder}/${file}`, contents };
          }));
          const config = DOSBOX_CONFIG.replace("STAR_CHS", language.value === "cht" ? "STAR_CHT" : "STAR_CHS");
          player = Dos(host, {
            dosboxConf: config,
            initFs,
            pathPrefix: "compat/runtime/emulators/",
            backend: "dosboxX",
            onEvent: (event, argument) => {
              if (event === "ci-ready" && argument && typeof argument.fsReadFile === "function") {
                commandInterface = argument;
                installInputLayer();
                saveOriginalButton.disabled = false;
                setStatus(storedSave ? "原版兼容层已启动 · 已恢复浏览器存档" : "原版兼容层已启动 · 可保存原版存档");
              }
            },
            imageRendering: "pixelated",
            renderAspect: true,
            autoStart: true
          });
          watchEmulatorViewport();
          installInputLayer();
          stop.disabled = false;
          setStatus("原版兼容层已启动 · 等待 STAROPEN.EXE 输出画面");
        } catch (error) {
          uninstallInputLayer();
          player = null;
          commandInterface = null;
          currentFolder = "";
          saveOriginalButton.disabled = true;
          setStatus(`启动失败 · ${error.message || error}`);
        } finally {
          launchInProgress = false;
          if (!player) {
            launch.disabled = false;
            language.disabled = false;
          }
        }
      }

      async function stopOriginal() {
        if (!player) return;
        await saveOriginalSave(false);
        try { await player.stop(); } catch (error) { setStatus(`停止时出现异常 · ${error.message || error}`); }
        uninstallInputLayer();
        player = null;
        launchInProgress = false;
        commandInterface = null;
        currentFolder = "";
        unwatchEmulatorViewport();
        host.innerHTML = "";
        host.style.height = "";
        launch.disabled = false;
        language.disabled = false;
        saveOriginalButton.disabled = true;
        stop.disabled = true;
        setStatus("兼容层已停止 · DOSBox-X WebAssembly 8.4.1");
      }

      launch.addEventListener("click", launchOriginal);
      saveOriginalButton.addEventListener("click", () => { saveOriginalSave(true); });
      stop.addEventListener("click", stopOriginal);
      window.StarDreamCompat = { launch: launchOriginal, save: saveOriginalSave, stop: stopOriginal, geometry: getEmulatorGeometry };
      const query = new URLSearchParams(window.location.search);
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.matchMedia("(max-width: 700px)").matches;
      if (query.get("autostart") === "1" || (isMobile && query.get("autostart") !== "0")) setTimeout(launchOriginal, 180);
    })();
  </script>
</body>
</html>
