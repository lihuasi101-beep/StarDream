name: Deploy STAR DREAM to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static artifact
        shell: pwsh
        env:
          STARDREAM_SUPABASE_URL: ${{ secrets.STARDREAM_SUPABASE_URL }}
          STARDREAM_SUPABASE_ANON_KEY: ${{ secrets.STARDREAM_SUPABASE_ANON_KEY }}
        run: ./publish-github.ps1 -OutputPath "$env:RUNNER_TEMP/stardream-pages"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/stardream-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
